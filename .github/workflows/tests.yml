name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      # Deliberately not `uv sync`: the suite imports no PySide6 or evdev, and skipping
      # the default group both keeps the job light and fails CI if a Qt import ever leaks
      # into core/ — which is exactly the boundary that keeps the bridge runnable under
      # /usr/bin/python3 on a user's machine.
      - name: Install test dependencies
        run: uv sync --no-default-groups --group dev

      # Undefined names are invisible to a test suite unless the line happens to be
      # exercised: mash-check referenced EV_ABS without defining it, and NameError fired on
      # real hardware -- on the dpad path -- while every test stayed green.
      - name: Check for undefined names
        run: uv run pyflakes src packaging scripts tests

      - name: Run tests
        run: uv run pytest -q
